<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Ano Ulam">
  <!--
    A commenter asked for a bigger, clearer site icon. The old favicon.ico only
    carried 16/32/48px bitmaps, so it went soft on every retina tab and every
    phone home screen. SVG stays sharp at any size, and Next.js App Router
    serves app/icon.svg automatically.

    Drawn for 16px first: two white shapes on the brand orange, a mound of food
    over a bowl, separated by a sliver of background so they stay readable when
    the whole thing is the size of a full stop.
  -->
  <defs>
    <linearGradient id="ulam" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="55%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ef4444" />
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="14" fill="url(#ulam)" />

  <!-- the ulam, heaped over the rim -->
  <path d="M18 32 A14 12 0 0 1 46 32 Z" fill="#fff" />

  <!-- the bowl -->
  <path d="M11 35 A21 19 0 0 0 53 35 Z" fill="#fff" />
</svg>
